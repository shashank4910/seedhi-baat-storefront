<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Preview of the pages inside the guide">
  <defs>
    <linearGradient id="pgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f2e8"/>
    </linearGradient>
  </defs>

  <!-- back pages (fan) -->
  <rect x="150" y="26" width="270" height="360" rx="10" fill="#e9e2cf" transform="rotate(5 285 206)"/>
  <rect x="130" y="24" width="270" height="360" rx="10" fill="#f1ebdb" transform="rotate(2.5 265 204)"/>

  <!-- top page -->
  <g>
    <rect x="106" y="20" width="270" height="360" rx="10" fill="url(#pgrad)" stroke="#e0d6bd"/>
    <!-- header -->
    <rect x="126" y="44" width="14" height="14" rx="4" fill="#1e6b4f"/>
    <text x="148" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#5a6053" letter-spacing="2">IDEA 01 · WHATSAPP CATALOGUE</text>
    <rect x="126" y="74" width="160" height="18" rx="4" fill="#1e6b4f"/>
    <text x="134" y="87" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" fill="#ffffff">THE SERVICE, EXPLAINED</text>
    <!-- text lines -->
    <g fill="#d9d0b8">
      <rect x="126" y="106" width="230" height="9" rx="4.5"/>
      <rect x="126" y="122" width="214" height="9" rx="4.5"/>
      <rect x="126" y="138" width="222" height="9" rx="4.5"/>
    </g>
    <!-- example price box -->
    <rect x="126" y="160" width="230" height="44" rx="8" fill="#eef7f0" stroke="#cfe5d6"/>
    <text x="138" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#174f3a">EXAMPLE STARTER PRICE</text>
    <text x="138" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5a6053">estimate for a small first order</text>
    <!-- tools row -->
    <g fill="#d9d0b8">
      <rect x="126" y="216" width="150" height="9" rx="4.5"/>
      <rect x="126" y="232" width="176" height="9" rx="4.5"/>
    </g>
    <!-- prompt block -->
    <rect x="126" y="254" width="230" height="58" rx="8" fill="#22271f"/>
    <text x="138" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#f7b733" letter-spacing="1">COPY-PASTE AI PROMPT</text>
    <g fill="#4a5142">
      <rect x="138" y="282" width="200" height="7" rx="3.5"/>
      <rect x="138" y="294" width="164" height="7" rx="3.5"/>
    </g>
    <!-- 7-day plan -->
    <rect x="126" y="324" width="230" height="34" rx="8" fill="#fdeee0" stroke="#f5d9b8"/>
    <text x="138" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" fill="#8a4a00">7-DAY FIRST-CUSTOMER PLAN</text>
  </g>

  <!-- gold "real guide" seal -->
  <g transform="translate(392 342)">
    <circle r="40" fill="#e8930c"/>
    <circle r="40" fill="none" stroke="#ffd9a0" stroke-width="3"/>
    <text y="-6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#2c1c00" text-anchor="middle">REAL</text>
    <text y="10" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#2c1c00" text-anchor="middle">PAGES</text>
  </g>
</svg>
